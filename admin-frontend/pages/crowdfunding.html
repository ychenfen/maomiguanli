<!-- Crowdfunding Management Page -->
<div class="page-container">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-card-icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">💝</div>
            <div class="stat-card-content">
                <div class="stat-card-value" id="totalProjects">0</div>
                <div class="stat-card-label">总项目数</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">⏳</div>
            <div class="stat-card-content">
                <div class="stat-card-value" id="activeProjects">0</div>
                <div class="stat-card-label">进行中</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">✓</div>
            <div class="stat-card-content">
                <div class="stat-card-value" id="completedProjects">0</div>
                <div class="stat-card-label">已完成</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">💰</div>
            <div class="stat-card-content">
                <div class="stat-card-value" id="totalRaised">¥0</div>
                <div class="stat-card-label">总筹款</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="filter-row">
                <div class="filter-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="搜索项目标题...">
                    <select id="statusFilter" class="form-control">
                        <option value="">全部状态</option>
                        <option value="DRAFT">草稿</option>
                        <option value="ACTIVE">进行中</option>
                        <option value="COMPLETED">已完成</option>
                        <option value="CANCELLED">已取消</option>
                    </select>
                    <button class="btn btn-primary" onclick="window.crowdfundingPageHandlers.search()">搜索</button>
                    <button class="btn btn-secondary" onclick="window.crowdfundingPageHandlers.reset()">重置</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>项目标题</th>
                            <th>目标金额</th>
                            <th>已筹金额</th>
                            <th>进度</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="crowdfundingTableBody">
                        <tr><td colspan="8" class="text-center">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination-container" id="paginationContainer"></div>
        </div>
    </div>
</div>

<div class="modal" id="detailModal">
    <div class="modal-dialog modal-lg">
        <div class="modal-header">
            <h3>项目详情</h3>
            <button class="modal-close" onclick="Modal.close('detailModal')">&times;</button>
        </div>
        <div class="modal-body" id="detailContent"></div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="Modal.close('detailModal')">关闭</button>
        </div>
    </div>
</div>

<div class="modal" id="reviewModal">
    <div class="modal-dialog">
        <div class="modal-header">
            <h3 id="reviewTitle">审核项目</h3>
            <button class="modal-close" onclick="Modal.close('reviewModal')">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="reviewId">
            <input type="hidden" id="reviewAction">
            <div class="form-group">
                <label>审核意见</label>
                <textarea id="reviewComment" class="form-control" rows="4"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="Modal.close('reviewModal')">取消</button>
            <button class="btn btn-primary" onclick="window.crowdfundingPageHandlers.submitReview()">提交</button>
        </div>
    </div>
</div>

<script>
window.crowdfundingPageState = window.crowdfundingPageState || { currentPage: 1, pageSize: 10, filters: {} };

window.crowdfundingPageHandlers = {
    async init() {
        await this.loadStatistics();
        await this.loadProjects();
    },

    async loadStatistics() {
        try {
            const statsPage = await ApiClient.request(API_ENDPOINTS.crowdfunding.list, {
                method: 'GET',
                params: { page: 1, size: 100 }
            });
            const records = statsPage.records || [];
            document.getElementById('totalProjects').textContent = statsPage.total || records.length;
            document.getElementById('activeProjects').textContent = records.filter((item) => item.status === 'ACTIVE').length;
            document.getElementById('completedProjects').textContent = records.filter((item) => item.status === 'COMPLETED').length;
            document.getElementById('totalRaised').textContent = Utils.formatCurrency(
                records.reduce((sum, item) => sum + Number(item.currentAmount || 0), 0)
            );
        } catch (error) {
            console.error('Load statistics error:', error);
        }
    },

    async loadProjects() {
        try {
            Loading.show();
            const params = {
                page: window.crowdfundingPageState.currentPage,
                size: window.crowdfundingPageState.pageSize,
                ...window.crowdfundingPageState.filters
            };

            const response = await ApiClient.request(API_ENDPOINTS.crowdfunding.list, {
                method: 'GET',
                params
            });

            this.renderTable(response.records || []);
            this.renderPagination(response.total || 0);
        } catch (error) {
            Toast.error('加载项目列表失败: ' + error.message);
            document.getElementById('crowdfundingTableBody').innerHTML = `
                <tr><td colspan="8" class="text-center text-danger">加载失败: ${error.message}</td></tr>
            `;
        } finally {
            Loading.hide();
        }
    },

    renderTable(projects) {
        const tbody = document.getElementById('crowdfundingTableBody');
        if (projects.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center">暂无数据</td></tr>';
            return;
        }

        tbody.innerHTML = projects.map(p => {
            const progress = p.progress ?? (p.targetAmount > 0 ? Math.round((Number(p.currentAmount || 0) / p.targetAmount) * 100) : 0);
            return `
            <tr>
                <td>${p.id}</td>
                <td>${p.title || '-'}</td>
                <td>${Utils.formatCurrency(p.targetAmount || 0)}</td>
                <td>${Utils.formatCurrency(p.currentAmount || 0)}</td>
                <td>
                    <div style="width: 100px;">
                        <div style="background: #f0f0f0; border-radius: 4px; overflow: hidden;">
                            <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 20px; width: ${progress}%; transition: width 0.3s;"></div>
                        </div>
                        <small>${progress}%</small>
                    </div>
                </td>
                <td><span class="badge badge-${this.getStatusColor(p.status)}">${this.getStatusText(p.status)}</span></td>
                <td>${Utils.formatDate(p.createTime)}</td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="window.crowdfundingPageHandlers.showDetail(${p.id})">详情</button>
                    ${p.status === 'DRAFT' ? `
                        <button class="btn btn-sm btn-success" onclick="window.crowdfundingPageHandlers.showReviewModal(${p.id}, 'activate')">激活</button>
                    ` : ''}
                    ${p.status === 'ACTIVE' ? `
                        <button class="btn btn-sm btn-danger" onclick="window.crowdfundingPageHandlers.showReviewModal(${p.id}, 'cancel')">结束</button>
                    ` : ''}
                </td>
            </tr>
        `}).join('');
    },

    renderPagination(total) {
        const totalPages = Math.ceil(total / window.crowdfundingPageState.pageSize);
        const container = document.getElementById('paginationContainer');
        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }
        PaginationComponent.render(container, {
            current: window.crowdfundingPageState.currentPage,
            total,
            pageSize: window.crowdfundingPageState.pageSize,
            onChange: (page) => {
                window.crowdfundingPageState.currentPage = page;
                this.loadProjects();
            }
        });
    },

    getStatusColor(status) {
        return { 'DRAFT': 'warning', 'ACTIVE': 'info', 'COMPLETED': 'success', 'CANCELLED': 'secondary' }[status] || 'secondary';
    },

    getStatusText(status) {
        return { 'DRAFT': '草稿', 'ACTIVE': '进行中', 'COMPLETED': '已完成', 'CANCELLED': '已取消' }[status] || status;
    },

    search() {
        const keyword = document.getElementById('searchInput').value.trim();
        const status = document.getElementById('statusFilter').value;
        window.crowdfundingPageState.filters = {};
        if (keyword) window.crowdfundingPageState.filters.keyword = keyword;
        if (status) window.crowdfundingPageState.filters.status = status;
        window.crowdfundingPageState.currentPage = 1;
        this.loadProjects();
    },

    reset() {
        document.getElementById('searchInput').value = '';
        document.getElementById('statusFilter').value = '';
        window.crowdfundingPageState.filters = {};
        window.crowdfundingPageState.currentPage = 1;
        this.loadProjects();
    },

    async showDetail(id) {
        try {
            Loading.show();
            const p = await ApiClient.request(API_ENDPOINTS.crowdfunding.detail(id));
            const progress = p.progress ?? (p.targetAmount > 0 ? Math.round((Number(p.currentAmount || 0) / p.targetAmount) * 100) : 0);
            document.getElementById('detailContent').innerHTML = `
                <div class="detail-section">
                    <h4>项目信息</h4>
                    <div class="detail-row"><span class="detail-label">标题:</span><span class="detail-value">${p.title || '-'}</span></div>
                    <div class="detail-row"><span class="detail-label">描述:</span><span class="detail-value">${p.description || '-'}</span></div>
                    <div class="detail-row"><span class="detail-label">目标金额:</span><span class="detail-value">${Utils.formatCurrency(p.targetAmount || 0)}</span></div>
                    <div class="detail-row"><span class="detail-label">已筹金额:</span><span class="detail-value">${Utils.formatCurrency(p.currentAmount || 0)}</span></div>
                    <div class="detail-row"><span class="detail-label">进度:</span><span class="detail-value">${progress}%</span></div>
                    <div class="detail-row"><span class="detail-label">状态:</span><span class="badge badge-${this.getStatusColor(p.status)}">${this.getStatusText(p.status)}</span></div>
                    <div class="detail-row"><span class="detail-label">创建时间:</span><span class="detail-value">${Utils.formatDate(p.createTime)}</span></div>
                    ${p.coverImage ? `<div class="detail-row"><span class="detail-label">封面:</span><img src="${p.coverImage}" style="max-width: 400px; margin-top: 10px;"></div>` : ''}
                </div>
            `;
            Modal.open('detailModal');
        } catch (error) {
            Toast.error('加载详情失败: ' + error.message);
        } finally {
            Loading.hide();
        }
    },

    showReviewModal(id, action) {
        document.getElementById('reviewId').value = id;
        document.getElementById('reviewAction').value = action;
        document.getElementById('reviewTitle').textContent = action === 'activate' ? '激活项目' : '结束项目';
        document.getElementById('reviewComment').value = '';
        Modal.open('reviewModal');
    },

    async submitReview() {
        const id = document.getElementById('reviewId').value;
        const action = document.getElementById('reviewAction').value;
        const comment = document.getElementById('reviewComment').value.trim();

        try {
            Loading.show();
            const endpoint = action === 'activate'
                ? API_ENDPOINTS.crowdfunding.activate(id)
                : API_ENDPOINTS.crowdfunding.cancel(id);

            await ApiClient.request(endpoint, {
                method: 'PUT'
            });

            Toast.success(action === 'activate' ? '项目已激活' : '项目已结束');
            Modal.close('reviewModal');
            await this.loadStatistics();
            await this.loadProjects();
        } catch (error) {
            Toast.error('操作失败: ' + error.message);
        } finally {
            Loading.hide();
        }
    }
};

window.crowdfundingPageHandlers.init();
</script>
