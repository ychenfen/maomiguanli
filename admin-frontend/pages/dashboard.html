<div class="page-header">
    <h1 class="page-title">数据概览</h1>
    <p class="page-description">查看系统整体运行状况和关键指标</p>
</div>

<!-- Statistics Cards -->
<div id="statsCards"></div>

<!-- Charts Row -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 20px;">
    <!-- User Growth Chart -->
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">用户增长趋势</h3>
            <div>
                <button class="btn btn-sm btn-default" onclick="loadUserGrowth(7)">7天</button>
                <button class="btn btn-sm btn-default" onclick="loadUserGrowth(30)">30天</button>
            </div>
        </div>
        <div class="card-body">
            <canvas id="userGrowthChart" style="max-height: 300px;"></canvas>
        </div>
    </div>

    <!-- Activity Statistics Chart -->
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">活跃度统计</h3>
            <div>
                <button class="btn btn-sm btn-default" onclick="loadActivityStats(7)">7天</button>
                <button class="btn btn-sm btn-default" onclick="loadActivityStats(30)">30天</button>
            </div>
        </div>
        <div class="card-body">
            <canvas id="activityChart" style="max-height: 300px;"></canvas>
        </div>
    </div>
</div>

<!-- Rankings Row -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 20px;">
    <!-- Popular Cats -->
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">热门动物排行</h3>
        </div>
        <div class="card-body">
            <div id="popularCats"></div>
        </div>
    </div>

    <!-- Active Users -->
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">活跃用户排行</h3>
        </div>
        <div class="card-body">
            <div id="activeUsers"></div>
        </div>
    </div>
</div>

<!-- System Health & Pending Tasks -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 20px;">
    <!-- System Health -->
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">系统健康状态</h3>
        </div>
        <div class="card-body">
            <div id="systemHealth"></div>
        </div>
    </div>

    <!-- Pending Tasks -->
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">待处理任务</h3>
        </div>
        <div class="card-body">
            <div id="pendingTasks"></div>
        </div>
    </div>
</div>

<!-- Recent Activities -->
<div class="card">
    <div class="card-header">
        <h3 class="card-title">最新动态</h3>
    </div>
    <div class="card-body">
        <div id="recentActivities"></div>
    </div>
</div>

<script>
const DASHBOARD_HEALTH_LABELS = {
    overall: '总体状态',
    database: '数据库',
    cache: '缓存',
    storage: '存储',
    services: '服务',
    network: '网络',
    lastCheck: '最近检查'
};

const DASHBOARD_TASK_LABELS = {
    total: '合计任务',
    verificationApplications: '认证申请',
    adoptionApplications: '领养申请',
    rescueRequests: '救助请求',
    financialApprovals: '财务审批',
    reportReviews: '待审核举报'
};

async function loadDashboardData() {
    const tasks = [
        loadStatistics(),
        loadUserGrowth(7),
        loadActivityStats(7),
        loadPopularCats(),
        loadActiveUsers(),
        loadSystemHealth(),
        loadPendingTasks(),
        loadRecentActivities()
    ];

    const results = await Promise.allSettled(tasks);
    if (results.every(result => result.status === 'rejected')) {
        Toast.error('加载失败', '无法加载仪表板数据');
    }
}

async function loadStatistics() {
    try {
        const statistics = await ApiClient.get(API.dashboard.statistics);
        displayStatistics(statistics || {});
    } catch (error) {
        console.error('Load dashboard statistics error:', error);
        displayStatistics({});
        throw error;
    }
}

function displayStatistics(data) {
    const userStats = data.userStatistics || {};
    const catStats = data.catStatistics || {};
    const contentStats = data.contentStatistics || {};
    const verificationStats = data.verificationStatistics || {};
    const financeStats = data.financialStatistics || {};

    const stats = [
        {
            title: '用户总数',
            value: userStats.totalUsers || 0,
            label: `今日新增: ${userStats.todayNewUsers || 0} · 活跃用户: ${userStats.activeUsers || 0}`,
            color: 'blue'
        },
        {
            title: '已认证用户',
            value: userStats.verifiedUsers || 0,
            label: `认证率: ${formatPercent(userStats.verificationRate)}`,
            color: 'orange'
        },
        {
            title: '动物总数',
            value: catStats.totalCats || 0,
            label: `可领养: ${catStats.adoptableCats || 0} · 已领养: ${catStats.adoptedCats || 0}`,
            color: 'green'
        },
        {
            title: '社区互动',
            value: contentStats.totalDynamics || 0,
            label: `点赞: ${contentStats.totalLikes || 0} · 评论: ${contentStats.totalComments || 0}`,
            color: 'orange'
        },
        {
            title: '待审核申请',
            value: verificationStats.pendingApplications || 0,
            label: `总申请: ${verificationStats.totalApplications || 0} · 通过率: ${formatPercent(verificationStats.approvalRate)}`,
            color: 'red'
        },
        {
            title: '当前余额',
            value: Utils.formatCurrency(financeStats.currentBalance || 0),
            label: `本月收入: ${Utils.formatCurrency(financeStats.monthIncome || 0)} · 支出: ${Utils.formatCurrency(financeStats.monthExpense || 0)}`,
            color: 'green'
        }
    ];

    StatsCardComponent.render(document.getElementById('statsCards'), stats);
}

async function loadUserGrowth(days) {
    try {
        const data = await ApiClient.get(API.dashboard.userGrowth, { days });
        renderLineChart('userGrowthChart', Array.isArray(data) ? data : [], 'date', 'newUsers');
    } catch (error) {
        console.error('Load user growth error:', error);
        throw error;
    }
}

async function loadActivityStats(days) {
    try {
        const data = await ApiClient.get(API.dashboard.activityStats, { days });
        const chartData = Array.isArray(data)
            ? data.map(item => ({
                ...item,
                totalActivity: (item.adoptions || 0) + (item.dynamics || 0) + (item.comments || 0) + (item.likes || 0)
            }))
            : [];
        renderLineChart('activityChart', chartData, 'date', 'totalActivity');
    } catch (error) {
        console.error('Load activity stats error:', error);
        throw error;
    }
}

async function loadPopularCats() {
    try {
        const data = await ApiClient.get(API.dashboard.popularCats, { limit: 5 });
        const ranking = Array.isArray(data)
            ? data.map(item => ({
                displayName: item.name || `动物#${item.id}`,
                displayValue: item.viewCount || 0
            })).sort((a, b) => b.displayValue - a.displayValue)
            : [];
        renderRanking('popularCats', ranking, 'displayName', 'displayValue', '浏览量');
    } catch (error) {
        console.error('Load popular cats error:', error);
        throw error;
    }
}

async function loadActiveUsers() {
    try {
        const data = await ApiClient.get(API.dashboard.activeUsers, { limit: 5 });
        const ranking = Array.isArray(data)
            ? data.map(item => ({
                displayName: item.realName || item.username || `用户#${item.id}`,
                displayValue: item.score || 0
            })).sort((a, b) => b.displayValue - a.displayValue)
            : [];
        renderRanking('activeUsers', ranking, 'displayName', 'displayValue', '活跃分');
    } catch (error) {
        console.error('Load active users error:', error);
        throw error;
    }
}

async function loadSystemHealth() {
    try {
        const data = await ApiClient.get(API.dashboard.systemHealth);
        renderSystemHealth(data || {});
    } catch (error) {
        console.error('Load system health error:', error);
        throw error;
    }
}

async function loadPendingTasks() {
    try {
        const data = await ApiClient.get(API.dashboard.pendingTasks);
        renderPendingTasks(data || {});
    } catch (error) {
        console.error('Load pending tasks error:', error);
        throw error;
    }
}

async function loadRecentActivities() {
    try {
        const data = await ApiClient.get(API.dashboard.recentActivities, { limit: 10 });
        renderRecentActivities(Array.isArray(data) ? data : []);
    } catch (error) {
        console.error('Load recent activities error:', error);
        throw error;
    }
}

function renderLineChart(canvasId, data, xKey, yKey) {
    const canvas = document.getElementById(canvasId);
    if (!canvas || !Array.isArray(data) || data.length === 0) {
        return;
    }

    const ctx = canvas.getContext('2d');
    const width = canvas.width = canvas.offsetWidth;
    const height = canvas.height = 300;

    ctx.clearRect(0, 0, width, height);

    const labels = data.map(item => item[xKey]);
    const values = data.map(item => Number(item[yKey]) || 0);
    const maxValue = Math.max(...values, 1);
    const padding = 40;
    const chartWidth = width - padding * 2;
    const chartHeight = height - padding * 2;
    const getX = (index) => values.length === 1
        ? padding + chartWidth / 2
        : padding + (chartWidth / (values.length - 1)) * index;

    ctx.strokeStyle = '#dcdfe6';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padding, padding);
    ctx.lineTo(padding, height - padding);
    ctx.lineTo(width - padding, height - padding);
    ctx.stroke();

    ctx.strokeStyle = '#667eea';
    ctx.lineWidth = 2;
    ctx.beginPath();

    values.forEach((value, index) => {
        const x = getX(index);
        const y = height - padding - (value / maxValue) * chartHeight;
        if (index === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    });

    ctx.stroke();

    ctx.fillStyle = '#667eea';
    values.forEach((value, index) => {
        const x = getX(index);
        const y = height - padding - (value / maxValue) * chartHeight;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
    });

    const labelInterval = Math.max(1, Math.ceil(labels.length / 6));
    ctx.fillStyle = '#666';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    labels.forEach((label, index) => {
        if (index % labelInterval !== 0 && index !== labels.length - 1) {
            return;
        }
        ctx.fillText(label, getX(index), height - padding + 20);
    });
}

function formatPercent(value) {
    const numeric = Number(value);
    if (!Number.isFinite(numeric)) {
        return '0%';
    }
    const normalized = numeric > 1 ? numeric : numeric * 100;
    return `${normalized.toFixed(normalized % 1 === 0 ? 0 : 1)}%`;
}

function getHealthStatusMeta(status) {
    const normalized = String(status ?? '').toLowerCase();
    if (['healthy', 'up', 'ok', 'true', 'normal'].includes(normalized)) {
        return { color: 'var(--success)', text: '正常' };
    }
    if (['warning', 'degraded'].includes(normalized)) {
        return { color: 'var(--warning)', text: '注意' };
    }
    return { color: 'var(--danger)', text: '异常' };
}

// Render ranking list
function renderRanking(containerId, data, nameKey, valueKey, valueLabel) {
    const container = document.getElementById(containerId);
    if (!container) {
        return;
    }
    if (!data || data.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-text">暂无数据</div></div>';
        return;
    }

    let html = '<div style="display: flex; flex-direction: column; gap: 12px;">';

    data.forEach((item, index) => {
        const rank = index + 1;
        const rankColor = rank === 1 ? '#f56c6c' : rank === 2 ? '#e6a23c' : rank === 3 ? '#67c23a' : '#909399';

        html += `
            <div style="display: flex; align-items: center; gap: 12px; padding: 8px; background: var(--bg-primary); border-radius: 6px;">
                <div style="width: 24px; height: 24px; border-radius: 50%; background: ${rankColor}; color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px;">
                    ${rank}
                </div>
                <div style="flex: 1; font-size: 14px; color: var(--text-primary);">
                    ${item[nameKey]}
                </div>
                <div style="font-size: 14px; color: var(--text-secondary);">
                    ${valueLabel}: ${item[valueKey]}
                </div>
            </div>
        `;
    });

    html += '</div>';
    container.innerHTML = html;
}

// Render system health
function renderSystemHealth(data) {
    const container = document.getElementById('systemHealth');
    if (!container || !data) return;

    const keys = ['overall', 'database', 'cache', 'storage', 'services', 'network', 'lastCheck']
        .filter(key => data[key] !== undefined && data[key] !== null && data[key] !== '');

    if (keys.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-text">暂无系统状态</div></div>';
        return;
    }

    let html = '<div style="display: flex; flex-direction: column; gap: 12px;">';

    keys.forEach(key => {
        const status = data[key];
        const label = DASHBOARD_HEALTH_LABELS[key] || key;

        if (key === 'lastCheck') {
            html += `
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px; background: var(--bg-primary); border-radius: 6px;">
                    <div style="font-size: 14px; color: var(--text-primary);">${label}</div>
                    <div style="font-size: 14px; color: var(--text-secondary);">${Utils.formatDate(status)}</div>
                </div>
            `;
            return;
        }

        const statusMeta = getHealthStatusMeta(status);

        html += `
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px; background: var(--bg-primary); border-radius: 6px;">
                <div style="font-size: 14px; color: var(--text-primary);">${label}</div>
                <div style="font-size: 14px; color: ${statusMeta.color}; font-weight: 500;">● ${statusMeta.text}</div>
            </div>
        `;
    });

    html += '</div>';
    container.innerHTML = html;
}

// Render pending tasks
function renderPendingTasks(data) {
    const container = document.getElementById('pendingTasks');
    if (!container || !data) return;

    const keys = ['total', 'verificationApplications', 'adoptionApplications', 'rescueRequests', 'financialApprovals', 'reportReviews']
        .filter(key => data[key] !== undefined && data[key] !== null);

    if (keys.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-text">暂无待处理任务</div></div>';
        return;
    }

    let html = '<div style="display: flex; flex-direction: column; gap: 12px;">';

    keys.forEach(key => {
        const count = data[key];
        const badgeClass = count > 0 ? 'badge-danger' : 'badge-success';

        html += `
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px; background: var(--bg-primary); border-radius: 6px;">
                <div style="font-size: 14px; color: var(--text-primary);">${DASHBOARD_TASK_LABELS[key] || key}</div>
                <span class="badge ${badgeClass}">${count}</span>
            </div>
        `;
    });

    html += '</div>';
    container.innerHTML = html;
}

// Render recent activities
function renderRecentActivities(data) {
    const container = document.getElementById('recentActivities');
    if (!container) {
        return;
    }
    if (!data || data.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-text">暂无动态</div></div>';
        return;
    }

    let html = '<div style="display: flex; flex-direction: column; gap: 12px;">';

    data.forEach(activity => {
        const actor = activity.user || '系统';
        const description = activity.description || activity.type || '系统操作';
        html += `
            <div style="display: flex; align-items: start; gap: 12px; padding: 12px; background: var(--bg-primary); border-radius: 6px;">
                <div style="width: 8px; height: 8px; border-radius: 50%; background: var(--primary-start); margin-top: 6px;"></div>
                <div style="flex: 1;">
                    <div style="font-size: 14px; color: var(--text-primary); margin-bottom: 4px;">
                        ${actor} · ${description}
                    </div>
                    <div style="font-size: 12px; color: var(--text-tertiary);">
                        ${Utils.formatDate(activity.timestamp || activity.createdAt || activity.createTime)}
                    </div>
                </div>
            </div>
        `;
    });

    html += '</div>';
    container.innerHTML = html;
}

// Initialize dashboard
loadDashboardData();

// Auto refresh every 5 minutes
setInterval(loadDashboardData, 5 * 60 * 1000);
</script>

<style>

    background: white;
    border-radius: 8px;
    padding: 20px;

    font-size: 14px;
    color: #666;
    margin-bottom: 10px;
}

    font-size: 32px;
    font-weight: bold;
    color: #333;
    margin-bottom: 5px;

    font-size: 12px;
