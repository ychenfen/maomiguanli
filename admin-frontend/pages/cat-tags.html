<!-- Cat Tags Management Page -->
<div class="page-container">
    <div class="card">
        <div class="card-header">
            <h3>动物标签管理</h3>
            <button class="btn btn-success" id="createTagBtn" onclick="window.catTagsPageHandlers.showCreateModal()">+ 添加标签</button>
        </div>
        <div class="card-body">
            <div id="catTagsNotice" style="display: none; margin-bottom: 16px; padding: 12px 14px; border-radius: 8px; background: #fff7e6; border: 1px solid #ffd591; color: #ad6800;"></div>
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>标签名称</th>
                            <th>标签类型</th>
                            <th>颜色</th>
                            <th>使用次数</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="catTagsTableBody">
                        <tr><td colspan="8" class="text-center">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination-container" id="paginationContainer"></div>
        </div>
    </div>
</div>

<div class="modal" id="tagModal">
    <div class="modal-dialog">
        <div class="modal-header">
            <h3 id="modalTitle">添加标签</h3>
            <button class="modal-close" onclick="Modal.close('tagModal')">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="tagId">
            <div class="form-group">
                <label>标签名称 *</label>
                <input type="text" id="tagName" class="form-control" required>
            </div>
            <div class="form-group">
                <label>标签类型 *</label>
                <select id="tagType" class="form-control">
                    <option value="CHARACTER">性格标签</option>
                    <option value="STATUS">状态标签</option>
                    <option value="ACTIVITY">活动标签</option>
                </select>
            </div>
            <div class="form-group">
                <label>颜色</label>
                <input type="color" id="tagColor" class="form-control" value="#67C23A">
            </div>
            <div class="form-group">
                <label>排序值</label>
                <input type="number" id="tagSortOrder" class="form-control" value="0" min="0">
            </div>
            <div class="form-group">
                <label>状态</label>
                <select id="tagStatus" class="form-control">
                    <option value="1">启用</option>
                    <option value="0">禁用</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="Modal.close('tagModal')">取消</button>
            <button class="btn btn-primary" onclick="window.catTagsPageHandlers.saveTag()">保存</button>
        </div>
    </div>
</div>

<script>
window.catTagsPageState = window.catTagsPageState || {
    currentPage: 1,
    pageSize: 10,
    apiUnavailable: false,
    tags: []
};

window.catTagsPageHandlers = {
    async init() {
        await this.loadTags();
    },

    async loadTags() {
        try {
            Loading.show();
            const tagsMap = await ApiClient.request(API_ENDPOINTS.catTags.list);
            const entries = this.flattenTags(tagsMap);

            window.catTagsPageState.apiUnavailable = false;
            window.catTagsPageState.tags = entries;
            document.getElementById('createTagBtn').disabled = false;
            this.setNotice('');
            this.renderCurrentPage();
        } catch (error) {
            console.error('Load cat tags error:', error);
            this.setApiUnavailable('标签数据暂时无法加载，请稍后重试。');
        } finally {
            Loading.hide();
        }
    },

    flattenTags(tagsMap) {
        if (!tagsMap || typeof tagsMap !== 'object') {
            return [];
        }

        return Object.values(tagsMap)
            .filter(Array.isArray)
            .flat()
            .map((tag) => normalizePayload(tag))
            .sort((a, b) => {
                const typeOrder = this.typeSortOrder(a.type) - this.typeSortOrder(b.type);
                if (typeOrder !== 0) return typeOrder;
                return (a.sortOrder || 0) - (b.sortOrder || 0) || (a.id || 0) - (b.id || 0);
            });
    },

    typeSortOrder(type) {
        return { CHARACTER: 0, STATUS: 1, ACTIVITY: 2 }[type] ?? 99;
    },

    setNotice(message) {
        const notice = document.getElementById('catTagsNotice');
        if (!notice) return;
        notice.style.display = message ? 'block' : 'none';
        notice.textContent = message || '';
    },

    setApiUnavailable(message) {
        window.catTagsPageState.apiUnavailable = true;
        this.setNotice(message);
        document.getElementById('createTagBtn').disabled = true;
        document.getElementById('paginationContainer').innerHTML = '';
        document.getElementById('catTagsTableBody').innerHTML = `
            <tr><td colspan="8" class="text-center" style="color: #ad6800;">${message}</td></tr>
        `;
    },

    renderCurrentPage() {
        const allTags = window.catTagsPageState.tags || [];
        const start = (window.catTagsPageState.currentPage - 1) * window.catTagsPageState.pageSize;
        const records = allTags.slice(start, start + window.catTagsPageState.pageSize);
        this.renderTable(records);
        this.renderPagination(allTags.length);
    },

    renderTable(tags) {
        const tbody = document.getElementById('catTagsTableBody');
        if (!tags.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center">暂无数据</td></tr>';
            return;
        }

        tbody.innerHTML = tags.map((tag) => `
            <tr>
                <td>${tag.id}</td>
                <td><span class="badge badge-info">${tag.name || '-'}</span></td>
                <td>${this.getTypeText(tag.type)}</td>
                <td>
                    <span style="display:inline-flex;align-items:center;gap:8px;">
                        <span style="width:14px;height:14px;border-radius:50%;background:${tag.color || '#67C23A'};border:1px solid rgba(0,0,0,0.08);"></span>
                        ${tag.color || '-'}
                    </span>
                </td>
                <td>${tag.useCount || 0}</td>
                <td>
                    <span class="badge badge-${Number(tag.isActive) === 1 ? 'success' : 'secondary'}">
                        ${Number(tag.isActive) === 1 ? '启用' : '禁用'}
                    </span>
                </td>
                <td>${Utils.formatDate(tag.createTime)}</td>
                <td>
                    <button class="btn btn-sm btn-primary" onclick="window.catTagsPageHandlers.showEditModal(${tag.id})">编辑</button>
                    <button class="btn btn-sm btn-warning" onclick="window.catTagsPageHandlers.toggleTag(${tag.id}, ${Number(tag.isActive) === 1 ? 'false' : 'true'})">
                        ${Number(tag.isActive) === 1 ? '禁用' : '启用'}
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="window.catTagsPageHandlers.deleteTag(${tag.id})">删除</button>
                </td>
            </tr>
        `).join('');
    },

    renderPagination(total) {
        const container = document.getElementById('paginationContainer');
        const totalPages = Math.ceil(total / window.catTagsPageState.pageSize);
        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }

        PaginationComponent.render(container, {
            current: window.catTagsPageState.currentPage,
            total,
            pageSize: window.catTagsPageState.pageSize,
            onChange: (page) => {
                window.catTagsPageState.currentPage = page;
                this.renderCurrentPage();
            }
        });
    },

    getTypeText(type) {
        return { CHARACTER: '性格标签', STATUS: '状态标签', ACTIVITY: '活动标签' }[type] || type || '-';
    },

    getDefaultColor(type) {
        return { CHARACTER: '#67C23A', STATUS: '#E6A23C', ACTIVITY: '#409EFF' }[type] || '#67C23A';
    },

    findTag(id) {
        return (window.catTagsPageState.tags || []).find((item) => Number(item.id) === Number(id));
    },

    showCreateModal() {
        if (window.catTagsPageState.apiUnavailable) {
            Toast.warning('标签服务暂时不可用，请稍后重试');
            return;
        }
        document.getElementById('modalTitle').textContent = '添加标签';
        document.getElementById('tagId').value = '';
        document.getElementById('tagName').value = '';
        document.getElementById('tagType').value = 'CHARACTER';
        document.getElementById('tagColor').value = this.getDefaultColor('CHARACTER');
        document.getElementById('tagSortOrder').value = '0';
        document.getElementById('tagStatus').value = '1';
        Modal.open('tagModal');
    },

    showEditModal(id) {
        if (window.catTagsPageState.apiUnavailable) {
            Toast.warning('标签服务暂时不可用，请稍后重试');
            return;
        }

        const tag = this.findTag(id);
        if (!tag) {
            Toast.error('未找到标签信息');
            return;
        }

        document.getElementById('modalTitle').textContent = '编辑标签';
        document.getElementById('tagId').value = tag.id;
        document.getElementById('tagName').value = tag.name || '';
        document.getElementById('tagType').value = tag.type || 'CHARACTER';
        document.getElementById('tagColor').value = tag.color || this.getDefaultColor(tag.type);
        document.getElementById('tagSortOrder').value = tag.sortOrder || 0;
        document.getElementById('tagStatus').value = Number(tag.isActive) === 1 ? '1' : '0';
        Modal.open('tagModal');
    },

    async saveTag() {
        if (window.catTagsPageState.apiUnavailable) {
            Toast.warning('标签服务暂时不可用，请稍后重试');
            return;
        }

        const id = document.getElementById('tagId').value;
        const body = {
            name: document.getElementById('tagName').value.trim(),
            type: document.getElementById('tagType').value,
            color: document.getElementById('tagColor').value,
            sortOrder: Number(document.getElementById('tagSortOrder').value || 0),
            isActive: Number(document.getElementById('tagStatus').value || 1)
        };

        if (!body.name) {
            Toast.warning('请输入标签名称');
            return;
        }

        try {
            Loading.show();
            if (id) {
                await ApiClient.request(API_ENDPOINTS.catTags.update(id), {
                    method: 'PUT',
                    body
                });
                Toast.success('更新成功');
            } else {
                await ApiClient.request(API_ENDPOINTS.catTags.create, {
                    method: 'POST',
                    body
                });
                Toast.success('添加成功');
            }

            Modal.close('tagModal');
            await this.loadTags();
        } catch (error) {
            Toast.error('保存失败: ' + error.message);
        } finally {
            Loading.hide();
        }
    },

    async toggleTag(id, active) {
        if (window.catTagsPageState.apiUnavailable) {
            Toast.warning('标签服务暂时不可用，请稍后重试');
            return;
        }

        try {
            Loading.show();
            await ApiClient.request(API_ENDPOINTS.catTags.toggle(id, active), {
                method: 'PUT'
            });
            Toast.success('状态已更新');
            await this.loadTags();
        } catch (error) {
            Toast.error('切换状态失败: ' + error.message);
        } finally {
            Loading.hide();
        }
    },

    async deleteTag(id) {
        if (window.catTagsPageState.apiUnavailable) {
            Toast.warning('标签服务暂时不可用，请稍后重试');
            return;
        }
        if (!confirm('确定要删除这个标签吗？')) return;

        try {
            Loading.show();
            await ApiClient.request(API_ENDPOINTS.catTags.delete(id), {
                method: 'DELETE'
            });
            Toast.success('删除成功');
            await this.loadTags();
        } catch (error) {
            Toast.error('删除失败: ' + error.message);
        } finally {
            Loading.hide();
        }
    }
};

document.getElementById('tagType')?.addEventListener('change', (event) => {
    if (!document.getElementById('tagId').value) {
        document.getElementById('tagColor').value = window.catTagsPageHandlers.getDefaultColor(event.target.value);
    }
});

window.catTagsPageHandlers.init();
</script>
