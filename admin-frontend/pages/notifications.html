<!-- Notifications Management Page -->
<div class="page-container">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-card-icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">🔔</div>
            <div class="stat-card-content">
                <div class="stat-card-value" id="totalNotifications">0</div>
                <div class="stat-card-label">总通知数</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">📤</div>
            <div class="stat-card-content">
                <div class="stat-card-value" id="unreadNotifications">0</div>
                <div class="stat-card-label">未读通知</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">✓</div>
            <div class="stat-card-content">
                <div class="stat-card-value" id="systemNotifications">0</div>
                <div class="stat-card-label">系统通知</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">📅</div>
            <div class="stat-card-content">
                <div class="stat-card-value" id="interactionNotifications">0</div>
                <div class="stat-card-label">互动通知</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="filter-row">
                <div class="filter-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="按标题或内容筛选当前页...">
                    <select id="typeFilter" class="form-control">
                        <option value="">全部类型</option>
                        <option value="SYSTEM">系统通知</option>
                        <option value="ADOPTION">领养通知</option>
                        <option value="VERIFICATION">认证通知</option>
                        <option value="RESCUE">救助通知</option>
                        <option value="LIKE">点赞通知</option>
                        <option value="COMMENT">评论通知</option>
                    </select>
                    <select id="readFilter" class="form-control">
                        <option value="">全部状态</option>
                        <option value="0">未读</option>
                        <option value="1">已读</option>
                    </select>
                    <button class="btn btn-primary" onclick="window.notificationsPageHandlers.search()">搜索</button>
                    <button class="btn btn-secondary" onclick="window.notificationsPageHandlers.reset()">重置</button>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-success" onclick="window.notificationsPageHandlers.showCreateModal()">+ 发送通知</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>类型</th>
                            <th>标题</th>
                            <th>接收者</th>
                            <th>状态</th>
                            <th>发送时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="notificationsTableBody">
                        <tr><td colspan="7" class="text-center">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination-container" id="paginationContainer"></div>
        </div>
    </div>
</div>

<div class="modal" id="detailModal">
    <div class="modal-dialog modal-lg">
        <div class="modal-header">
            <h3>通知详情</h3>
            <button class="modal-close" onclick="Modal.close('detailModal')">&times;</button>
        </div>
        <div class="modal-body" id="detailContent"></div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="Modal.close('detailModal')">关闭</button>
        </div>
    </div>
</div>

<div class="modal" id="createModal">
    <div class="modal-dialog">
        <div class="modal-header">
            <h3>发送通知</h3>
            <button class="modal-close" onclick="Modal.close('createModal')">&times;</button>
        </div>
        <div class="modal-body">
            <form id="notificationForm">
                <div class="form-group">
                    <label>通知类型 *</label>
                    <select id="notificationType" class="form-control" required>
                        <option value="">请选择</option>
                        <option value="SYSTEM">系统通知</option>
                        <option value="ADOPTION">领养通知</option>
                        <option value="VERIFICATION">认证通知</option>
                        <option value="RESCUE">救助通知</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>标题 *</label>
                    <input type="text" id="notificationTitle" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>内容 *</label>
                    <textarea id="notificationContent" class="form-control" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>优先级</label>
                    <select id="notificationPriority" class="form-control">
                        <option value="LOW">低</option>
                        <option value="MEDIUM" selected>中</option>
                        <option value="HIGH">高</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>接收用户ID *</label>
                    <textarea id="notificationUserIds" class="form-control" rows="3" placeholder="请输入用户ID，多个用户用逗号分隔，例如：2,5" required></textarea>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="Modal.close('createModal')">取消</button>
            <button class="btn btn-primary" onclick="window.notificationsPageHandlers.sendNotification()">发送</button>
        </div>
    </div>
</div>

<script>
window.notificationsPageState = window.notificationsPageState || { currentPage: 1, pageSize: 10, filters: {} };

window.notificationsPageHandlers = {
    async init() {
        await this.loadStatistics();
        await this.loadNotifications();
    },

    async loadStatistics() {
        try {
            const stats = await ApiClient.request(API_ENDPOINTS.notifications.statistics);
            document.getElementById('totalNotifications').textContent = stats.totalCount || 0;
            document.getElementById('unreadNotifications').textContent = stats.unreadCount || 0;
            document.getElementById('systemNotifications').textContent = stats.systemCount || 0;
            document.getElementById('interactionNotifications').textContent = Number(stats.likeCount || 0) + Number(stats.commentCount || 0);
        } catch (error) {
            console.error('Load statistics error:', error);
        }
    },

    async loadNotifications() {
        try {
            Loading.show();
            const params = {
                page: window.notificationsPageState.currentPage,
                size: window.notificationsPageState.pageSize
            };

            if (window.notificationsPageState.filters.type) {
                params.type = window.notificationsPageState.filters.type;
            }
            if (window.notificationsPageState.filters.isRead !== undefined && window.notificationsPageState.filters.isRead !== '') {
                params.isRead = window.notificationsPageState.filters.isRead;
            }

            const response = await ApiClient.request(API_ENDPOINTS.notifications.list, {
                method: 'GET',
                params
            });

            const records = this.applyLocalFilter(response.records || []);
            this.renderTable(records);
            this.renderPagination(response.total || 0);
        } catch (error) {
            Toast.error('加载通知列表失败: ' + error.message);
            document.getElementById('notificationsTableBody').innerHTML = `
                <tr><td colspan="7" class="text-center text-danger">加载失败: ${error.message}</td></tr>
            `;
        } finally {
            Loading.hide();
        }
    },

    renderTable(notifications) {
        const tbody = document.getElementById('notificationsTableBody');
        if (notifications.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">暂无数据</td></tr>';
            return;
        }

        tbody.innerHTML = notifications.map(n => `
            <tr>
                <td>${n.id}</td>
                <td><span class="badge badge-${this.getTypeColor(n.type)}">${n.typeText || this.getTypeText(n.type)}</span></td>
                <td>${n.title || '-'}</td>
                <td>${n.userId ? `用户#${n.userId}` : '-'}</td>
                <td><span class="badge badge-${Number(n.isRead) === 1 ? 'success' : 'warning'}">${Number(n.isRead) === 1 ? '已读' : '未读'}</span></td>
                <td>${Utils.formatDate(n.createTime)}</td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="window.notificationsPageHandlers.showDetail(${n.id})">详情</button>
                    <button class="btn btn-sm btn-danger" onclick="window.notificationsPageHandlers.deleteNotification(${n.id})">删除</button>
                </td>
            </tr>
        `).join('');
    },

    renderPagination(total) {
        const container = document.getElementById('paginationContainer');
        PaginationComponent.render(container, {
            current: window.notificationsPageState.currentPage,
            total,
            pageSize: window.notificationsPageState.pageSize,
            onChange: (page) => {
                window.notificationsPageState.currentPage = page;
                this.loadNotifications();
            }
        });
    },

    getTypeColor(type) {
        return {
            'SYSTEM': 'primary',
            'ADOPTION': 'success',
            'VERIFICATION': 'info',
            'RESCUE': 'warning',
            'LIKE': 'success',
            'COMMENT': 'info',
            'ANNOUNCEMENT': 'primary',
            'REMINDER': 'warning',
            'WARNING': 'danger'
        }[type] || 'secondary';
    },

    getTypeText(type) {
        return {
            'SYSTEM': '系统通知',
            'ADOPTION': '领养通知',
            'VERIFICATION': '认证通知',
            'RESCUE': '救助通知',
            'LIKE': '点赞通知',
            'COMMENT': '评论通知',
            'ANNOUNCEMENT': '公告',
            'REMINDER': '提醒',
            'WARNING': '警告'
        }[type] || type;
    },

    applyLocalFilter(notifications) {
        const keyword = (window.notificationsPageState.filters.keyword || '').toLowerCase();
        if (!keyword) return notifications;

        return notifications.filter((item) => {
            const haystack = [item.title, item.content, item.typeText, this.getTypeText(item.type)]
                .filter(Boolean)
                .join(' ')
                .toLowerCase();
            return haystack.includes(keyword);
        });
    },

    search() {
        const keyword = document.getElementById('searchInput').value.trim();
        const type = document.getElementById('typeFilter').value;
        const isRead = document.getElementById('readFilter').value;
        window.notificationsPageState.filters = {};
        if (keyword) window.notificationsPageState.filters.keyword = keyword;
        if (type) window.notificationsPageState.filters.type = type;
        if (isRead !== '') window.notificationsPageState.filters.isRead = Number(isRead);
        window.notificationsPageState.currentPage = 1;
        this.loadNotifications();
    },

    reset() {
        document.getElementById('searchInput').value = '';
        document.getElementById('typeFilter').value = '';
        document.getElementById('readFilter').value = '';
        window.notificationsPageState.filters = {};
        window.notificationsPageState.currentPage = 1;
        this.loadNotifications();
    },

    async showDetail(id) {
        try {
            Loading.show();
            const n = await ApiClient.request(API_ENDPOINTS.notifications.detail(id));
            document.getElementById('detailContent').innerHTML = `
                <div class="detail-section">
                    <h4>通知信息</h4>
                    <div class="detail-row"><span class="detail-label">类型:</span><span class="badge badge-${this.getTypeColor(n.type)}">${n.typeText || this.getTypeText(n.type)}</span></div>
                    <div class="detail-row"><span class="detail-label">标题:</span><span class="detail-value">${n.title || '-'}</span></div>
                    <div class="detail-row"><span class="detail-label">内容:</span><span class="detail-value">${n.content || '-'}</span></div>
                    <div class="detail-row"><span class="detail-label">接收者:</span><span class="detail-value">${n.userId ? `用户#${n.userId}` : '-'}</span></div>
                    <div class="detail-row"><span class="detail-label">优先级:</span><span class="detail-value">${n.priority || '-'}</span></div>
                    <div class="detail-row"><span class="detail-label">状态:</span><span class="badge badge-${Number(n.isRead) === 1 ? 'success' : 'warning'}">${Number(n.isRead) === 1 ? '已读' : '未读'}</span></div>
                    <div class="detail-row"><span class="detail-label">发送时间:</span><span class="detail-value">${Utils.formatDate(n.createTime)}</span></div>
                    ${n.readTime ? `<div class="detail-row"><span class="detail-label">读取时间:</span><span class="detail-value">${Utils.formatDate(n.readTime)}</span></div>` : ''}
                </div>
            `;
            Modal.open('detailModal');
        } catch (error) {
            Toast.error('加载详情失败: ' + error.message);
        } finally {
            Loading.hide();
        }
    },

    showCreateModal() {
        document.getElementById('notificationForm').reset();
        document.getElementById('notificationPriority').value = 'MEDIUM';
        Modal.open('createModal');
    },

    async sendNotification() {
        const type = document.getElementById('notificationType').value;
        const priority = document.getElementById('notificationPriority').value;
        const title = document.getElementById('notificationTitle').value.trim();
        const content = document.getElementById('notificationContent').value.trim();
        const userIds = document.getElementById('notificationUserIds').value
            .split(',')
            .map((value) => parseInt(value.trim(), 10))
            .filter((value) => !Number.isNaN(value));

        if (!type || !title || !content || userIds.length === 0) {
            Toast.warning('请填写所有必填项');
            return;
        }

        try {
            Loading.show();
            const data = {
                userId: userIds[0],
                type,
                priority,
                title,
                content
            };

            const endpoint = userIds.length === 1
                ? API_ENDPOINTS.notifications.send
                : `${API_ENDPOINTS.notifications.sendBatch}?userIds=${userIds.join(',')}`;

            await ApiClient.request(endpoint, {
                method: 'POST',
                body: data
            });

            Toast.success('发送成功');
            Modal.close('createModal');
            await this.loadStatistics();
            await this.loadNotifications();
        } catch (error) {
            if (/系统异常|接收用户ID不能为空/.test(error.message)) {
                Toast.error('发送失败', '通知暂时无法发送，请稍后重试。');
            } else {
                Toast.error('发送失败: ' + error.message);
            }
        } finally {
            Loading.hide();
        }
    },

    async deleteNotification(id) {
        if (!confirm('确定要删除这条通知吗？')) return;

        try {
            Loading.show();
            await ApiClient.request(API_ENDPOINTS.notifications.delete(id), {
                method: 'DELETE'
            });
            Toast.success('删除成功');
            await this.loadStatistics();
            await this.loadNotifications();
        } catch (error) {
            Toast.error('删除失败: ' + error.message);
        } finally {
            Loading.hide();
        }
    }
};

window.notificationsPageHandlers.init();
</script>
