<div class="page-container">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-card-icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">👥</div>
            <div class="stat-card-content">
                <div class="stat-card-value" id="totalUsers">0</div>
                <div class="stat-card-label">总用户数</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">✅</div>
            <div class="stat-card-content">
                <div class="stat-card-value" id="activeUsers">0</div>
                <div class="stat-card-label">活跃用户</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">🤝</div>
            <div class="stat-card-content">
                <div class="stat-card-value" id="volunteerUsers">0</div>
                <div class="stat-card-label">志愿者</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">🛡️</div>
            <div class="stat-card-content">
                <div class="stat-card-value" id="adminUsers">0</div>
                <div class="stat-card-label">管理员</div>
            </div>
        </div>
    </div>

    <div class="card" id="fallbackNotice" style="display: none;">
        <div class="card-body">
            当前部署包的用户分页接口返回异常，已自动切换到详情聚合模式显示用户列表。详情查看可用，批量管理建议以原始源码版本为准。
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="filter-row">
                <div class="filter-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="搜索用户名、姓名、邮箱、手机号...">
                    <select id="roleFilter" class="form-control">
                        <option value="">全部角色</option>
                        <option value="USER">普通用户</option>
                        <option value="VOLUNTEER">志愿者</option>
                        <option value="ADMIN">管理员</option>
                        <option value="SUPER_ADMIN">超级管理员</option>
                    </select>
                    <select id="statusFilter" class="form-control">
                        <option value="">全部状态</option>
                        <option value="1">正常</option>
                        <option value="0">禁用</option>
                    </select>
                    <button class="btn btn-primary" onclick="window.usersPageHandlers.search()">搜索</button>
                    <button class="btn btn-secondary" onclick="window.usersPageHandlers.reset()">重置</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>用户列表</h3>
        </div>
        <div class="card-body">
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>姓名</th>
                            <th>角色</th>
                            <th>状态</th>
                            <th>手机号</th>
                            <th>邮箱</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="9" class="text-center">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination-container" id="paginationContainer"></div>
        </div>
    </div>
</div>

<div class="modal" id="userDetailModal">
    <div class="modal-dialog modal-lg">
        <div class="modal-header">
            <h3>用户详情</h3>
            <button class="modal-close" onclick="Modal.close('userDetailModal')">&times;</button>
        </div>
        <div class="modal-body" id="userDetailContent"></div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="Modal.close('userDetailModal')">关闭</button>
        </div>
    </div>
</div>

<script>
window.usersPageState = {
    currentPage: 1,
    pageSize: 10,
    filters: {},
    stats: {},
    allUsers: [],
    filteredUsers: [],
    usingFallback: false
};

window.usersPageHandlers = {
    async init() {
        await this.loadStatistics();
        await this.loadUsers();
    },

    roleBadge(role, roleText) {
        const text = roleText || {
            USER: '普通用户',
            VOLUNTEER: '志愿者',
            ADMIN: '管理员',
            SUPER_ADMIN: '超级管理员'
        }[role] || role || '-';

        const badge = {
            USER: 'info',
            VOLUNTEER: 'success',
            ADMIN: 'warning',
            SUPER_ADMIN: 'danger'
        }[role] || 'secondary';

        return `<span class="badge badge-${badge}">${text}</span>`;
    },

    statusBadge(user) {
        const status = Number(user.status);
        const text = user.statusText || (status === 1 ? '正常' : '禁用');
        return `<span class="badge badge-${status === 1 ? 'success' : 'danger'}">${text}</span>`;
    },

    normalizeStatusFilter(value) {
        if (value === '' || value === undefined || value === null) return '';
        return Number(value);
    },

    buildFilterParams() {
        const params = {
            page: window.usersPageState.currentPage,
            size: window.usersPageState.pageSize
        };

        if (window.usersPageState.filters.keyword) {
            params.keyword = window.usersPageState.filters.keyword;
        }
        if (window.usersPageState.filters.role) {
            params.role = window.usersPageState.filters.role;
        }
        if (
            window.usersPageState.filters.status !== '' &&
            window.usersPageState.filters.status !== undefined &&
            window.usersPageState.filters.status !== null
        ) {
            params.status = window.usersPageState.filters.status;
        }

        return params;
    },

    matchesFilters(user) {
        const filters = window.usersPageState.filters;
        const keyword = (filters.keyword || '').toLowerCase();

        if (filters.role && user.role !== filters.role) {
            return false;
        }

        if (
            filters.status !== '' &&
            filters.status !== undefined &&
            filters.status !== null &&
            Number(user.status) !== Number(filters.status)
        ) {
            return false;
        }

        if (!keyword) {
            return true;
        }

        const haystack = [
            user.username,
            user.realName,
            user.email,
            user.phone,
            user.studentId,
            user.college
        ]
            .filter(Boolean)
            .join(' ')
            .toLowerCase();

        return haystack.includes(keyword);
    },

    async loadStatistics() {
        try {
            const stats = await ApiClient.request(API_ENDPOINTS.users.statistics);
            window.usersPageState.stats = stats || {};

            document.getElementById('totalUsers').textContent = stats.totalUsers || 0;
            document.getElementById('activeUsers').textContent = stats.activeUsers || 0;
            document.getElementById('volunteerUsers').textContent = stats.volunteers || 0;
            document.getElementById('adminUsers').textContent = Number(stats.admins || 0) + Number(stats.superAdmins || 0);
        } catch (error) {
            console.error('Load user statistics error:', error);
        }
    },

    async loadUsersFromFallback() {
        const expectedTotal = Number(window.usersPageState.stats.totalUsers || 0);
        const upperBound = Math.max(expectedTotal * 3, 12);
        const headers = {
            'Content-Type': 'application/json'
        };
        const token = Auth.getToken();
        if (token) {
            headers.Authorization = `Bearer ${token}`;
        }

        const users = [];
        let misses = 0;

        for (let id = 1; id <= upperBound; id += 1) {
            const response = await fetch(API_ENDPOINTS.users.detail(id), {
                method: 'GET',
                headers
            });
            const result = normalizePayload(await response.json());

            if (result.code === 200 && result.data) {
                users.push(result.data);
                misses = 0;
                if (expectedTotal && users.length >= expectedTotal) {
                    break;
                }
            } else {
                misses += 1;
                if (users.length > 0 && misses >= 4) {
                    break;
                }
            }
        }

        users.sort((left, right) => Number(left.id) - Number(right.id));
        return users;
    },

    async loadUsers() {
        try {
            Loading.show();
            window.usersPageState.usingFallback = true;
            document.getElementById('fallbackNotice').style.display = 'block';
            window.usersPageState.allUsers = await this.loadUsersFromFallback();
            window.usersPageState.filteredUsers = window.usersPageState.allUsers.filter((user) => this.matchesFilters(user));

            this.renderTable();
            this.renderPagination(window.usersPageState.filteredUsers.length);
        } catch (error) {
            Toast.error('加载用户列表失败: ' + error.message);
            document.getElementById('usersTableBody').innerHTML = `
                <tr><td colspan="9" class="text-center text-danger">加载失败: ${error.message}</td></tr>
            `;
        } finally {
            Loading.hide();
        }
    },

    renderTable() {
        const tbody = document.getElementById('usersTableBody');
        const start = (window.usersPageState.currentPage - 1) * window.usersPageState.pageSize;
        const users = window.usersPageState.filteredUsers.slice(start, start + window.usersPageState.pageSize);

        if (users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center">暂无数据</td></tr>';
            return;
        }

        tbody.innerHTML = users.map((user) => `
            <tr>
                <td>${user.id}</td>
                <td>${user.username || '-'}</td>
                <td>${user.realName || '-'}</td>
                <td>${this.roleBadge(user.role, user.roleText)}</td>
                <td>${this.statusBadge(user)}</td>
                <td>${user.phone || '-'}</td>
                <td>${user.email || '-'}</td>
                <td>${Utils.formatDate(user.createTime)}</td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="window.usersPageHandlers.showDetail(${user.id})">详情</button>
                </td>
            </tr>
        `).join('');
    },

    renderPagination(total) {
        const container = document.getElementById('paginationContainer');
        PaginationComponent.render(container, {
            current: window.usersPageState.currentPage,
            total,
            pageSize: window.usersPageState.pageSize,
            onChange: (page) => {
                window.usersPageState.currentPage = page;
                this.renderTable();
                this.renderPagination(total);
            }
        });
    },

    search() {
        window.usersPageState.filters = {
            keyword: document.getElementById('searchInput').value.trim(),
            role: document.getElementById('roleFilter').value,
            status: this.normalizeStatusFilter(document.getElementById('statusFilter').value)
        };
        window.usersPageState.currentPage = 1;
        this.loadUsers();
    },

    reset() {
        document.getElementById('searchInput').value = '';
        document.getElementById('roleFilter').value = '';
        document.getElementById('statusFilter').value = '';
        window.usersPageState.filters = {};
        window.usersPageState.currentPage = 1;
        this.loadUsers();
    },

    async showDetail(id) {
        try {
            Loading.show();
            const user = await ApiClient.request(API_ENDPOINTS.users.detail(id));
            document.getElementById('userDetailContent').innerHTML = `
                <div class="detail-section">
                    <h4>基础信息</h4>
                    <div class="detail-row"><span class="detail-label">用户ID:</span><span class="detail-value">${user.id}</span></div>
                    <div class="detail-row"><span class="detail-label">用户名:</span><span class="detail-value">${user.username || '-'}</span></div>
                    <div class="detail-row"><span class="detail-label">真实姓名:</span><span class="detail-value">${user.realName || '-'}</span></div>
                    <div class="detail-row"><span class="detail-label">角色:</span><span class="detail-value">${user.roleText || user.role || '-'}</span></div>
                    <div class="detail-row"><span class="detail-label">状态:</span><span class="detail-value">${user.statusText || (Number(user.status) === 1 ? '正常' : '禁用')}</span></div>
                    <div class="detail-row"><span class="detail-label">性别:</span><span class="detail-value">${user.genderText || '-'}</span></div>
                    <div class="detail-row"><span class="detail-label">学院:</span><span class="detail-value">${user.college || '-'}</span></div>
                    <div class="detail-row"><span class="detail-label">学号:</span><span class="detail-value">${user.studentId || '-'}</span></div>
                    <div class="detail-row"><span class="detail-label">手机号:</span><span class="detail-value">${user.phone || '-'}</span></div>
                    <div class="detail-row"><span class="detail-label">邮箱:</span><span class="detail-value">${user.email || '-'}</span></div>
                    <div class="detail-row"><span class="detail-label">简介:</span><span class="detail-value">${user.introduction || '-'}</span></div>
                    <div class="detail-row"><span class="detail-label">创建时间:</span><span class="detail-value">${Utils.formatDate(user.createTime)}</span></div>
                    <div class="detail-row"><span class="detail-label">更新时间:</span><span class="detail-value">${Utils.formatDate(user.updateTime)}</span></div>
                </div>
            `;
            Modal.open('userDetailModal');
        } catch (error) {
            Toast.error('加载用户详情失败: ' + error.message);
        } finally {
            Loading.hide();
        }
    }
};

window.usersPageHandlers.init();
</script>
