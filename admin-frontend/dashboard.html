<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 动物救助系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
        }

        .header {
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left h1 {
            font-size: 20px;
            color: #333;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            color: #666;
            font-size: 14px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #f56c6c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #f45454;
        }

        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 12px;
            color: #999;
        }

        .stat-card.blue { border-left: 4px solid #409EFF; }
        .stat-card.green { border-left: 4px solid #67C23A; }
        .stat-card.orange { border-left: 4px solid #E6A23C; }
        .stat-card.red { border-left: 4px solid #F56C6C; }

        .section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            background: #f5f7fa;
            padding: 12px;
            text-align: left;
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>🐾 动物救助系统 - 管理后台</h1>
        </div>
        <div class="header-right">
            <div class="user-info">
                <span id="userName">管理员</span>
            </div>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </div>

    <div class="container">
        <div id="loadingMessage" class="loading">加载中...</div>
        <div id="errorMessage" class="error" style="display: none;"></div>
        <div id="content" style="display: none;">
            <!-- 统计卡片 -->
            <div class="stats-grid">
                <div class="stat-card blue">
                    <h3>用户总数</h3>
                    <div class="value" id="totalUsers">-</div>
                    <div class="label">今日新增: <span id="todayUsers">-</span></div>
                </div>
                <div class="stat-card green">
                    <h3>动物总数</h3>
                    <div class="value" id="totalCats">-</div>
                    <div class="label">可领养: <span id="adoptableCats">-</span></div>
                </div>
                <div class="stat-card orange">
                    <h3>社区动态</h3>
                    <div class="value" id="totalDynamics">-</div>
                    <div class="label">今日发布: <span id="todayDynamics">-</span></div>
                </div>
                <div class="stat-card red">
                    <h3>待审核申请</h3>
                    <div class="value" id="pendingApplications">-</div>
                    <div class="label">身份认证申请</div>
                </div>
            </div>

            <!-- 财务统计 -->
            <div class="section">
                <h2>财务概览</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>总收入</h3>
                        <div class="value" id="totalIncome">-</div>
                        <div class="label">本月: ¥<span id="monthIncome">-</span></div>
                    </div>
                    <div class="stat-card">
                        <h3>总支出</h3>
                        <div class="value" id="totalExpense">-</div>
                        <div class="label">本月: ¥<span id="monthExpense">-</span></div>
                    </div>
                    <div class="stat-card">
                        <h3>当前余额</h3>
                        <div class="value" id="currentBalance">-</div>
                        <div class="label">待处理交易: <span id="pendingTransactions">-</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_BASE = (window.__API_BASE__ || '/api').replace(/\/$/, '');

        // 检查登录状态
        function checkAuth() {
            const token = localStorage.getItem('admin_token');
            const user = localStorage.getItem('admin_user');

            if (!token || !user) {
                window.location.href = 'login.html';
                return null;
            }

            const userObj = JSON.parse(user);
            document.getElementById('userName').textContent = userObj.realName || userObj.username;

            return token;
        }

        // 退出登录
        function logout() {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
            window.location.href = 'login.html';
        }

        // 加载数据
        async function loadDashboardData() {
            const token = checkAuth();
            if (!token) return;

            try {
                const response = await fetch(`${API_BASE}/admin/dashboard/statistics`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const result = await response.json();

                if (result.code === 200) {
                    displayData(result.data);
                    document.getElementById('loadingMessage').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                } else if (result.code === 401) {
                    showError('登录已过期，请重新登录');
                    setTimeout(() => {
                        logout();
                    }, 2000);
                } else {
                    showError(result.message || '加载数据失败');
                }
            } catch (error) {
                console.error('加载数据错误:', error);
                showError('网络错误，请检查后端服务是否启动');
            }
        }

        // 显示数据
        function displayData(data) {
            // 用户统计
            if (data.userStatistics) {
                document.getElementById('totalUsers').textContent = data.userStatistics.totalUsers || 0;
                document.getElementById('todayUsers').textContent = data.userStatistics.todayNewUsers || 0;
            }

            // 动物统计
            if (data.catStatistics) {
                document.getElementById('totalCats').textContent = data.catStatistics.totalCats || 0;
                document.getElementById('adoptableCats').textContent = data.catStatistics.adoptableCats || 0;
            }

            // 内容统计
            if (data.contentStatistics) {
                document.getElementById('totalDynamics').textContent = data.contentStatistics.totalDynamics || 0;
                document.getElementById('todayDynamics').textContent = data.contentStatistics.todayDynamics || 0;
            }

            // 认证统计
            if (data.verificationStatistics) {
                document.getElementById('pendingApplications').textContent = data.verificationStatistics.pendingApplications || 0;
            }

            // 财务统计
            if (data.financialStatistics) {
                document.getElementById('totalIncome').textContent = '¥' + (data.financialStatistics.totalIncome || 0);
                document.getElementById('monthIncome').textContent = data.financialStatistics.monthIncome || 0;
                document.getElementById('totalExpense').textContent = '¥' + (data.financialStatistics.totalExpense || 0);
                document.getElementById('monthExpense').textContent = data.financialStatistics.monthExpense || 0;
                document.getElementById('currentBalance').textContent = '¥' + (data.financialStatistics.currentBalance || 0);
                document.getElementById('pendingTransactions').textContent = data.financialStatistics.pendingTransactions || 0;
            }
        }

        // 显示错误
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('loadingMessage').style.display = 'none';
        }

        // 页面加载时执行
        window.onload = () => {
            loadDashboardData();
        };
    </script>
</body>
</html>
